<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEBULA STRIKER — Arcade Shooter</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#04050c radial-gradient(900px 500px at 50% -10%,#0d1230,transparent);
    display:flex;align-items:center;justify-content:center;
    font-family:"Courier New",ui-monospace,monospace;
    color:#cfefff;overflow:hidden;user-select:none;
  }
  #cab{width:min(94vw,560px,calc((100vh - 120px)*.72));}

  /* ===== HEADER ===== */
  header{
    display:flex;align-items:center;gap:10px;
    background:#0a1122;border:3px solid #1b2b4a;border-bottom:none;
    border-radius:12px 12px 0 0;padding:8px 12px;
    box-shadow:0 0 22px rgba(0,170,255,.15), inset 0 0 18px rgba(0,0,0,.6);
  }
  #hpBox{display:flex;align-items:center;gap:6px;font-size:11px;color:#9adcff;letter-spacing:1px}
  #hpBar{width:100px;height:12px;border:2px solid #2a4a8a;background:#081020}
  #hpFill{height:100%;width:100%;background:#3dff7a;transition:width .15s}
  #hpNum{min-width:24px;text-align:right;font-weight:bold;color:#fff}
  #levelBox{
    margin:0 auto;padding:6px 26px;text-align:center;
    background:#10203f;border:2px solid #2a4a8a;
    clip-path:polygon(0 0,100% 0,82% 100%,18% 100%);
    font-weight:bold;letter-spacing:2px;color:#7dffea;text-shadow:0 0 10px #0ff;font-size:14px;
    white-space:nowrap;
  }
  #rightBox{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .barRow{display:flex;align-items:center;gap:5px;font-size:9px;color:#9adcff;letter-spacing:1px}
  .bar{width:110px;height:10px;border:2px solid #2a4a8a;background:#081020}
  .bar>div{height:100%;width:0%}
  #ultFill{background:repeating-linear-gradient(45deg,#0ff 0 5px,#0899b6 5px 10px)}
  #ammoFill{background:#3dff7a}
  #ammoFill.reloading{background:#ffd24a;animation:ultPulse .4s infinite alternate}
  #ammoNum{min-width:16px;font-weight:bold;color:#fff}
  #ultBox.ready #ultFill{animation:ultPulse .5s infinite alternate}
  @keyframes ultPulse{from{filter:brightness(1)}to{filter:brightness(1.9)}}

  /* ===== PLAYFIELD + CRT ===== */
  #gameWrap{position:relative;border:3px solid #1b2b4a;background:#05070f;
    box-shadow:0 0 30px rgba(0,170,255,.12), inset 0 0 40px rgba(0,0,0,.7)}
  canvas{display:block;width:100%;height:auto}
  #gameWrap::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px);}

  /* ===== OVERLAY ===== */
  .overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:rgba(4,7,18,.9);text-align:center;padding:16px}
  .hidden{display:none}
  .title{font-size:32px;font-weight:bold;letter-spacing:6px;line-height:1.15;color:#7dffea;
    text-shadow:3px 0 #ff3d6e,-3px 0 #0ff,0 0 18px #0ff;}
  .title.small{font-size:24px;letter-spacing:4px}
  .tap{color:#9adcff;letter-spacing:2px;font-weight:bold;text-shadow:0 0 10px #0af}
  .blink{animation:blink 1s steps(2,start) infinite}
  @keyframes blink{50%{opacity:0}}
  .ctrl{font-size:11px;line-height:1.9;color:#8fb7d9;border:1px dashed #2a4a8a;padding:8px 14px;letter-spacing:1px}
  .copy{font-size:9px;color:#44608a;letter-spacing:1px}
  #endSub{color:#9adcff;font-size:13px;letter-spacing:1px;line-height:1.6}
  #endStats{color:#ffd24a;font-size:12px;letter-spacing:1px;line-height:1.8}
</style>
</head>
<body>
<div id="cab">
  <header>
    <div id="hpBox"><span>HP</span><div id="hpBar"><div id="hpFill"></div></div><span id="hpNum">100</span></div>
    <div id="levelBox">LEVEL <span id="levelNum">1</span></div>
    <div id="rightBox">
      <div class="barRow" id="ultBox"><span>ULTIMATE</span><div class="bar"><div id="ultFill"></div></div></div>
      <div class="barRow"><span>AMMO</span><div class="bar"><div id="ammoFill"></div></div><span id="ammoNum">15</span></div>
    </div>
  </header>
  <div id="gameWrap">
    <canvas id="cv"></canvas>

    <div id="attract" class="overlay">
      <div class="title">NEBULA<br>STRIKER</div>
      <div class="tap blink">TAP THE KEYBOARD TO PLAY</div>
      <div class="ctrl">
        MOVE&nbsp;&nbsp;: ARROW KEYS / WASD<br>
        SHOOT&nbsp;: SPACE (15 ammo, auto-reload 2s)<br>
        ULTIMATE : U (10 kill = 100%)<br>
        PAUSE&nbsp;&nbsp;: P / ESC &nbsp;|&nbsp; MUTE : M
      </div>
      <div class="copy">© 2025 SCHOOL ARCADE PROJECT</div>
    </div>

    <div id="pauseOv" class="overlay hidden">
      <div class="title small">PAUSE</div>
      <div class="tap blink">PRESS [P] TO RESUME</div>
    </div>

    <div id="end" class="overlay hidden">
      <div id="endTitle" class="title small">CONGRATULATIONS!</div>
      <div id="endSub"></div>
      <div id="endStats"></div>
      <div id="endTap" class="tap blink hidden">TAP THE KEYBOARD TO CONTINUE</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= KONFIGURASI ================= */
const CFG={
  LEVELS:5, WAVES:2, BATCHES:4,          // 4 squad per wave
  BATCH_PAUSE:2, WAVE_PAUSE:5,
  HP_MAX:1000, HP_RESET:100,               // HP direset ke 50% tiap naik level
  DMG_ENEMY:5, DMG_BOSS:10, DMG_SKILL:25,
  AMMO_MAX:15, RELOAD_TIME:1.5,
  ULT_PER_KILL:10,                       // 10 kill = 100%
  ULT_PER_BOSSHIT:10,                    // saat boss: +10% per tembakan kena
  ULT_TIME:1, ULT_BOSS_TICK:2,
  BOUNCE_FROM:3, BOUNCE_CHANCE:0.15, BOUNCE_MAX:5,
  BOSS_DMG_BASE:11,                      // damage ke boss = 11 - level
};
const W=480,H=640;
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=W*DPR;cv.height=H*DPR;ctx.scale(DPR,DPR);

const $=id=>document.getElementById(id);
const hpFill=$("hpFill"),hpNum=$("hpNum"),levelNum=$("levelNum"),
      ultFill=$("ultFill"),ultBox=$("ultBox"),ammoFill=$("ammoFill"),ammoNum=$("ammoNum"),
      attractOv=$("attract"),endOv=$("end"),endTitle=$("endTitle"),endSub=$("endSub"),
      endStats=$("endStats"),endTap=$("endTap"),pauseOv=$("pauseOv");
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ================= AUDIO ================= */
let AC=null,muted=false;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC;}
function tone(f,d,type,v,slide,delay){if(muted)return;type=type||"square";v=v==null?.12:v;delay=delay||0;
  const a=ac(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,v){if(muted)return;d=d||.3;v=v||.2;const a=ac(),n=Math.floor(a.sampleRate*d),
  b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v;
  s.connect(g);g.connect(a.destination);s.start();}
const SFX={
  coin(){tone(988,.09,"square",.15);tone(1319,.25,"square",.15,0,.09);},
  shoot(){tone(880,.08,"square",.06,240);},
  eShoot(){tone(320,.06,"sawtooth",.04,180);},
  hit(){tone(240,.07,"square",.1,120);},
  boom(){noise(.25,.25);tone(150,.25,"sawtooth",.12,40);},
  pHit(){noise(.35,.3);tone(120,.4,"sawtooth",.15,30);},
  ult(){tone(160,.7,"sawtooth",.2,980);noise(.5,.12);},
  warn(){tone(700,.25,"sawtooth",.14,300);tone(700,.25,"sawtooth",.14,300,.35);},
  wave(){[523,659,784].forEach((f,i)=>tone(f,.12,"square",.11,0,i*.1));},
  levelUp(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,"square",.11,0,i*.09));},
  over(){tone(392,.25,"sawtooth",.14,180);tone(300,.3,"sawtooth",.14,140,.25);tone(220,.6,"sawtooth",.14,70,.55);},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,"square",.12,0,i*.13));},
};

/* ================= STATE ================= */
let state="attract",paused=false;
let level=1,wave=1,batch=0,phase="banner",phaseT=0;
let hp=CFG.HP_MAX,ult=0,ultT=0,ultTick=0;
let kills=0,score=0,shake=0,endLock=0,time=0,hitFlash=0;
let boss=null,lasers=[];
const player={x:W/2,y:H-64,w:22,h:24,cool:0,inv:0,scale:1,alive:true,ammo:CFG.AMMO_MAX,reload:0};
let enemies=[],pB=[],eB=[],parts=[];
const stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+.4,v:rnd(12,42)});

/* Pola gerak musuh per level (makin kacau & intens) */
const LVT=[null,
 {move:"sine",amp:30,fr:1.1,yA:6, yF:.8, fi:1.8, fv:0,  aim:0,  bs:150,di:null},
 {move:"sine",amp:62,fr:1.7,yA:14,yF:1.2,fi:1.5, fv:.2, aim:.12,bs:175,di:null},
 {move:"dash",amp:26,fr:1.2,yA:10,yF:1,  fi:1.3, fv:.5, aim:.25,bs:200,di:[.9,1.8]},
 {move:"vel", amp:0, fr:0,  yA:0, yF:0,  fi:1.1, fv:.6, aim:.45,bs:225,di:[.5,1.2]},
 {move:"seek",amp:12,fr:6,  yA:0, yF:0,  fi:.95, fv:.6, aim:.6, bs:255,di:[.35,.9]},
];
/* 5 boss dengan skill unik */
const BOSSES=[null,
 {name:"VANGUARD",col:"#ff8c42",skill:"sweep", speed:1.2},
 {name:"CYCLONE", col:"#ffd24a",skill:"ring",  speed:1.35},
 {name:"PHANTOM", col:"#42c6ff",skill:"cross", speed:1.5},
 {name:"RAPTOR",  col:"#c44dff",skill:"dash",  speed:1.65},
 {name:"OVERLORD",col:"#ff3d6e",skill:"spiral",speed:1.8},
];

/* ================= INPUT ================= */
const keys={};
const GAMEKEYS=["arrowup","arrowdown","arrowleft","arrowright"," ","w","a","s","d","u","m","p","escape"];
addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||/^F\d+$/i.test(e.key))return;
  const k=e.key.toLowerCase();
  if(GAMEKEYS.includes(k))e.preventDefault();
  if(state==="attract"){if(!e.repeat){SFX.coin();startGame();}return;}
  if(state==="gameover"||state==="victory"){if(!e.repeat&&endLock<=0)toAttract();return;}
  if(k==="p"||k==="escape"){if(!e.repeat)togglePause();return;}
  if(paused)return;
  keys[k]=true;
  if(k==="u"&&!e.repeat)tryUltimate();
  if(k==="m"&&!e.repeat)muted=!muted;
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;if(state==="playing"&&!paused)togglePause(true);});
function togglePause(force){
  paused=force===true?true:!paused;
  pauseOv.classList.toggle("hidden",!paused);
}

/* ================= ALUR ================= */
function startGame(){
  state="playing";paused=false;pauseOv.classList.add("hidden");
  level=1;wave=1;batch=0;hp=CFG.HP_MAX;ult=0;ultT=0;kills=0;score=0;
  enemies=[];pB=[];eB=[];parts=[];lasers=[];boss=null;
  Object.assign(player,{x:W/2,y:H-64,cool:0,inv:0,scale:1,alive:true,ammo:CFG.AMMO_MAX,reload:0});
  phase="banner";phaseT=1.6;
  attractOv.classList.add("hidden");endOv.classList.add("hidden");
  levelNum.textContent=level;bars();
}
function toAttract(){
  state="attract";level=1;wave=1;hp=CFG.HP_MAX;ult=0;
  levelNum.textContent=level;bars();
  endOv.classList.add("hidden");attractOv.classList.remove("hidden");
}
function levelUp(){
  level++;wave=1;batch=0;boss=null;lasers=[];
  hp=CFG.HP_RESET;                      // reset HP 50%
  levelNum.textContent=level;SFX.levelUp();
  phase="banner";phaseT=1.8;bars();
}
function endGame(win){
  state=win?"victory":"gameover";endLock=1.2;
  endTitle.textContent=win?"CONGRATULATIONS!":"GAME OVER";
  endTitle.style.color=win?"#7dffea":"#ff3d6e";
  endTitle.style.textShadow=win?"3px 0 #ff3d6e,-3px 0 #0ff,0 0 18px #0ff":"3px 0 #0ff,-3px 0 #ff3d6e,0 0 18px #f36";
  endSub.innerHTML=win?"Kamu selamat dari 5 level + 5 boss dan menyelamatkan galaksi!":"Pesawatmu hancur di level "+level+"...";
  endStats.innerHTML="SCORE : "+score+"<br>MUSUH DIHANCURKAN : "+kills;
  endTap.classList.add("hidden");endOv.classList.remove("hidden");
  if(win)SFX.win();else SFX.over();
}
function bars(){
  hpFill.style.width=Math.max(0,hp)+"%";
  hpFill.style.background=hp>50?"#3dff7a":hp>25?"#ffd24a":"#ff3d6e";
  hpNum.textContent=Math.max(0,Math.ceil(hp));
  if(player.reload>0){ammoFill.classList.add("reloading");ammoFill.style.width=((1-player.reload/CFG.RELOAD_TIME)*100)+"%";ammoNum.textContent="--";}
  else{ammoFill.classList.remove("reloading");ammoFill.style.width=(player.ammo/CFG.AMMO_MAX*100)+"%";ammoNum.textContent=player.ammo;}
  ultFill.style.width=ult+"%";
  ultBox.classList.toggle("ready",ult>=100);
}
function damagePlayer(d){
  if(player.inv>0||!player.alive)return;
  hp-=d;player.inv=1.1;hitFlash=.35;shake=Math.max(shake,10);SFX.pHit();
  explode(player.x,player.y,"#7dffea",10);
  if(hp<=0){hp=0;player.alive=false;phase="dying";phaseT=1.4;explode(player.x,player.y,"#7dffea",40);}
  bars();
}
function explode(x,y,col,n){
  n=n||16;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(40,220);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.7),max:.7,col,sz:rnd(2,4)});}
}
function spawnSquad(){
  const n=4+level;                       // 5,6,7,8,9 kapal per squad
  const maxHp=level+1;                   // 2,3,4,5,6 hit
  for(let i=0;i<n;i++){
    const x0=W*(i+1)/(n+1),y0=rnd(66,100);
    enemies.push({x0,y0,x:x0,y:y0,w:26,h:24,hp:maxHp,maxHp,
      t:Math.random()*6,ph:Math.random()*Math.PI*2,
      vx:0,vy:0,dashT:rnd(.6,1.5),tgt:null,
      fireT:level===1?1.2+i*.3:rnd(.7,1.6),
      flash:0,spawn:.4,dead:false});
  }
}
function hitEnemy(e,dmg){
  if(e.dead)return;
  e.hp-=dmg;e.flash=.12;
  if(e.hp<=0){e.dead=true;kills++;score+=100*level;
    ult=Math.min(100,ult+CFG.ULT_PER_KILL);
    explode(e.x,e.y,"#ff3d6e");SFX.boom();bars();}
  else SFX.hit();
}
function tryUltimate(){
  if(state!=="playing"||ult<100||ultT>0||!player.alive)return;
  ultT=CFG.ULT_TIME;ultTick=0;ult=0;
  shake=Math.max(shake,10);SFX.ult();bars();
}
function fireEnemy(e,P){
  let vx=0,vy=P.bs;
  if(P.aim>0&&Math.random()<P.aim&&player.alive){
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    vx=dx/d*P.bs;vy=dy/d*P.bs;
  }else if(level>=2)vx=rnd(-30,30);
  const bouncy=level>=CFG.BOUNCE_FROM&&Math.random()<CFG.BOUNCE_CHANCE;
  if(bouncy){vx=rnd(-90,90);vy=P.bs*.9;}
  eB.push({x:e.x,y:e.y+10,vx,vy,bouncy,bounces:CFG.BOUNCE_MAX,dmg:CFG.DMG_ENEMY,col:bouncy?"#ffd24a":"#ff5c5c",dead:false});
  SFX.eShoot();
}

/* ================= BOSS ================= */
function spawnBoss(){
  boss={x:W/2,y:-70,ty:95,hp:100,maxHp:100,w:52,h:48,t:0,ph:Math.random()*6,flash:0,
    state:"enter",reT:0,tx:W/2,tyy:95,skillT:2.5,fireT:1.2,
    spiralT:0,spiralA:0,emit:0,rings:0,ringT:0,teleT:0,tx2:0,ty2:0,dvx:0,dvy:0,dead:false};
  ult=0;bars();                          // ultimate reset saat boss muncul
}
function bossBullet(x,y,vx,vy){eB.push({x,y,vx,vy,bouncy:false,bounces:0,dmg:CFG.DMG_BOSS,col:"#c44dff",dead:false});SFX.eShoot();}
function bossFire(){
  const bs=170+level*20,dx=player.x-boss.x,dy=player.y-boss.y,d=Math.hypot(dx,dy)||1;
  const n=level>=3?3:1;
  for(let k=0;k<n;k++){const off=(k-(n-1)/2)*.25,ca=Math.cos(off),sa=Math.sin(off);
    bossBullet(boss.x,boss.y+20,(dx/d*ca-dy/d*sa)*bs,(dx/d*sa+dy/d*ca)*bs);}
}
function castSkill(){
  const s=BOSSES[level].skill;SFX.warn();
  if(s==="sweep")lasers.push({kind:"sweep",t:0,tele:.9,dur:1.7,w:80,dir:Math.random()<.5?1:-1});
  else if(s==="cross")lasers.push({kind:"cross",t:0,tele:.9,dur:.6,px:player.x,py:player.y});
  else if(s==="ring"){boss.rings=2;boss.ringT=0;}
  else if(s==="dash"){boss.state="dashtele";boss.teleT=.6;boss.tx2=player.x;boss.ty2=player.y;}
  else if(s==="spiral"){boss.spiralT=1.8;boss.spiralA=0;boss.emit=0;}
}
function sweepX(L){const p=(L.t-L.tele)/L.dur;return L.dir===1?-L.w/2+(W+L.w)*p:W+L.w/2-(W+L.w)*p;}
function bossDie(){
  boss.dead=true;score+=1000*level;kills++;
  explode(boss.x,boss.y,BOSSES[level].col,60);
  lasers=[];eB=[];shake=20;SFX.boom();SFX.levelUp();
  phase="bossdead";phaseT=1.6;
}
function updBoss(dt){
  const B=boss,BS=BOSSES[level];
  B.t+=dt;B.flash=Math.max(0,B.flash-dt);
  if(B.state==="enter"){B.y+=(B.ty-B.y)*Math.min(1,dt*3);if(B.y>B.ty-2)B.state="fight";}
  else if(B.state==="dashtele"){B.teleT-=dt;if(B.teleT<=0){B.state="dash";
      const dx=B.tx2-B.x,dy=B.ty2-B.y,d=Math.hypot(dx,dy)||1,s=520+level*50;B.dvx=dx/d*s;B.dvy=dy/d*s;}}
  else if(B.state==="dash"){
    B.x+=B.dvx*dt;B.y+=B.dvy*dt;
    if(player.alive&&Math.abs(B.x-player.x)<B.w/2+player.w/2&&Math.abs(B.y-player.y)<B.h/2+player.h/2)damagePlayer(CFG.DMG_SKILL);
    if(B.y>=B.ty2||B.y>H-110)B.state="return";
  }
  else if(B.state==="return"){B.y+=(B.ty-B.y)*Math.min(1,dt*3);B.x+=(W/2-B.x)*Math.min(1,dt*2);
    if(B.y<B.ty+4)B.state="fight";}
  else{ // fight: gerak dinamis (retarget acak, makin cepat per level)
    B.reT-=dt;if(B.reT<=0){B.reT=rnd(.5,1.1)/BS.speed;B.tx=rnd(50,W-50);B.tyy=rnd(70,150);}
    const sp=(120+level*25)*BS.speed,dx=B.tx-B.x,dy=B.tyy-B.y,d=Math.hypot(dx,dy)||1;
    B.x=clamp(B.x+dx/d*sp*dt+Math.sin(B.t*3)*30*dt,40,W-40);
    B.y=clamp(B.y+dy/d*sp*dt,60,170);
    B.skillT-=dt;if(B.skillT<=0){castSkill();B.skillT=Math.max(2,rnd(3.2,4.6)-level*.25);}
    B.fireT-=dt;if(B.fireT<=0){B.fireT=Math.max(.5,1.3-level*.12);bossFire();}
  }
  if(B.spiralT>0){B.spiralT-=dt;B.spiralA+=dt*4.2;B.emit-=dt;
    if(B.emit<=0){B.emit=.09;for(let k=0;k<3;k++){const a=B.spiralA+k*2.094,s=190+level*15;
      bossBullet(B.x,B.y+10,Math.cos(a)*s,Math.sin(a)*s*.8+60);}}}
  if(B.rings>0){B.ringT-=dt;if(B.ringT<=0){B.rings--;B.ringT=.5;
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2+(B.rings*.22),s=150+level*12;
      bossBullet(B.x,B.y+10,Math.cos(a)*s,Math.sin(a)*s);}}}
}

/* ================= UPDATE ================= */
function update(dt){
  time+=dt;shake=Math.max(0,shake-40*dt);hitFlash=Math.max(0,hitFlash-dt);
  for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=-2;s.x=Math.random()*W;}}
  if(endLock>0){endLock-=dt;if(endLock<=0&&(state==="gameover"||state==="victory"))endTap.classList.remove("hidden");}
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;}
  parts=parts.filter(p=>p.life>0);
  if(state!=="playing")return;

  const P=LVT[level];

  /* --- pemain + ammo/reload --- */
  if(player.alive){
    const sp=280,
      lf=keys["arrowleft"]||keys["a"],rt=keys["arrowright"]||keys["d"],
      up=keys["arrowup"]||keys["w"],dn=keys["arrowdown"]||keys["s"];
    player.x=clamp(player.x+((rt?1:0)-(lf?1:0))*sp*dt,16,W-16);
    player.y=clamp(player.y+((dn?1:0)-(up?1:0))*sp*dt,H*.5,H-22);
    player.cool-=dt;player.inv=Math.max(0,player.inv-dt);
    if(player.reload>0){player.reload-=dt;if(player.reload<=0){player.ammo=CFG.AMMO_MAX;bars();}}
    else if(keys[" "]&&player.cool<=0&&ultT<=0){
      player.cool=.18;player.ammo--;
      pB.push({x:player.x,y:player.y-16,dead:false});SFX.shoot();
      if(player.ammo<=0)player.reload=CFG.RELOAD_TIME;
      bars();
    }
  }
  player.scale+=((ultT>0?2:1)-player.scale)*Math.min(1,dt*10);

  /* --- ultimate beam --- */
  if(ultT>0){
    ultT-=dt;ultTick-=dt;
    if(ultTick<=0){ultTick=.12;
      const bw=W*.9,bx=clamp(player.x-bw/2,0,W-bw);
      for(const e of enemies)if(!e.dead&&e.x>bx-8&&e.x<bx+bw+8&&e.y<player.y)hitEnemy(e,e.hp);
      for(const b of eB)if(b.x>bx-8&&b.x<bx+bw+8&&b.y<player.y){b.dead=true;explode(b.x,b.y,b.col,4);}
      if(boss&&!boss.dead&&boss.state!=="enter"&&boss.x>bx-8&&boss.x<bx+bw+8){
        boss.hp-=CFG.ULT_BOSS_TICK;boss.flash=.1;
        if(boss.hp<=0)bossDie();
      }
    }
    if(ultT<=0)bars();
  }

  /* --- musuh biasa --- */
  for(const e of enemies){
    e.t+=dt;e.flash=Math.max(0,e.flash-dt);e.spawn=Math.max(0,e.spawn-dt);
    if(P.move==="sine"){e.x=e.x0+Math.sin(e.t*P.fr+e.ph)*P.amp;e.y=e.y0+Math.sin(e.t*P.yF+e.ph*1.7)*P.yA;}
    else if(P.move==="dash"){
      e.dashT-=dt;if(e.dashT<=0){e.dashT=rnd(P.di[0],P.di[1]);e.vx=rnd(90,170)*(Math.random()<.5?-1:1);}
      e.x+=e.vx*dt;e.vx*=Math.pow(.5,dt);
      if(e.x<18){e.x=18;e.vx=Math.abs(e.vx);}if(e.x>W-18){e.x=W-18;e.vx=-Math.abs(e.vx);}
      e.y=e.y0+Math.sin(e.t*P.yF+e.ph)*P.yA;
    }else if(P.move==="vel"){
      e.dashT-=dt;
      if(e.dashT<=0){e.dashT=rnd(P.di[0],P.di[1]);const a=Math.random()*Math.PI*2,s=rnd(70,150)+level*10;e.vx=Math.cos(a)*s;e.vy=Math.sin(a)*s*.6;}
      e.x+=e.vx*dt;e.y+=e.vy*dt;
      if(e.x<18||e.x>W-18){e.vx*=-1;e.x=clamp(e.x,18,W-18);}
      if(e.y<56||e.y>H*.42){e.vy*=-1;e.y=clamp(e.y,56,H*.42);}
    }else{
      e.dashT-=dt;
      if(e.dashT<=0||!e.tgt){e.dashT=rnd(P.di[0],P.di[1]);e.tgt={x:rnd(24,W-24),y:rnd(58,H*.4)};}
      const dx=e.tgt.x-e.x,dy=e.tgt.y-e.y,d=Math.hypot(dx,dy)||1,s=110+level*14;
      e.x=clamp(e.x+dx/d*s*dt+Math.sin(e.t*P.fr+e.ph)*P.amp*dt,18,W-18);
      e.y=clamp(e.y+dy/d*s*dt,56,H*.42);
    }
    if(player.alive&&e.spawn<=0){e.fireT-=dt;
      if(e.fireT<=0){e.fireT=P.fi+(Math.random()*2-1)*P.fv;fireEnemy(e,P);}}
  }

  /* --- boss --- */
  if(boss&&!boss.dead&&phase==="boss")updBoss(dt);

  /* --- peluru --- */
  for(const b of pB){b.y-=540*dt;if(b.y<-20)b.dead=true;}
  for(const b of eB){
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.bouncy){
      let bounced=false;
      if(b.x<6&&b.vx<0){b.vx*=-1;bounced=true;}
      if(b.x>W-6&&b.vx>0){b.vx*=-1;bounced=true;}
      if(b.y<6&&b.vy<0){b.vy*=-1;bounced=true;}
      if(b.y>H-6&&b.vy>0){b.vy*=-1;bounced=true;}
      if(bounced){b.bounces--;explode(b.x,b.y,"#ffd24a",3);if(b.bounces<0)b.dead=true;} // hilang setelah 5 pantulan
    }else if(b.y>H+20||b.y<-20||b.x<-20||b.x>W+20)b.dead=true;
  }

  /* --- laser skill boss --- */
  for(const L of lasers){L.t+=dt;if(L.t>L.tele+L.dur)L.dead=true;}
  lasers=lasers.filter(l=>!l.dead);
  if(player.alive&&player.inv<=0){
    const hw=player.w*player.scale/2,hh=player.h*player.scale/2;
    for(const L of lasers){
      if(L.t<L.tele)continue;
      if(L.kind==="sweep"){const x=sweepX(L);
        if(player.x+hw>x-L.w/2&&player.x-hw<x+L.w/2){damagePlayer(CFG.DMG_SKILL);break;}}
      else if(player.x+hw>L.px-13&&player.x-hw<L.px+13||player.y+hh>L.py-13&&player.y-hh<L.py+13){damagePlayer(CFG.DMG_SKILL);break;}
    }
  }

  /* --- tabrakan peluru --- */
  const pDmg=CFG.BOSS_DMG_BASE-level;
  for(const b of pB)if(!b.dead){
    for(const e of enemies)if(!e.dead&&Math.abs(b.x-e.x)<e.w/2+3&&Math.abs(b.y-e.y)<e.h/2+8){b.dead=true;hitEnemy(e,1);break;}
    if(!b.dead&&boss&&!boss.dead&&boss.state!=="enter"&&
       Math.abs(b.x-boss.x)<boss.w/2+4&&Math.abs(b.y-boss.y)<boss.h/2+8){
      b.dead=true;boss.hp-=pDmg;boss.flash=.12;score+=50;
      ult=Math.min(100,ult+CFG.ULT_PER_BOSSHIT);   // +10% per tembakan saat boss
      SFX.hit();explode(b.x,b.y,BOSSES[level].col,5);
      if(boss.hp<=0)bossDie();
      bars();
    }
  }
  if(player.alive&&player.inv<=0){
    const hw=player.w*player.scale/2+3,hh=player.h*player.scale/2+6;
    for(const b of eB)if(!b.dead&&Math.abs(b.x-player.x)<hw&&Math.abs(b.y-player.y)<hh){b.dead=true;damagePlayer(b.dmg);break;}
  }
  enemies=enemies.filter(e=>!e.dead);
  pB=pB.filter(b=>!b.dead);
  eB=eB.filter(b=>!b.dead);

  /* --- alur fase --- */
  if(!player.alive){if(phase==="dying"){phaseT-=dt;if(phaseT<=0)endGame(false);}bars();return;}
  if(phase==="banner"){phaseT-=dt;if(phaseT<=0){phase="combat";batch=1;spawnSquad();}}
  else if(phase==="combat"){
    if(enemies.length===0){
      if(batch<CFG.BATCHES){phase="batchpause";phaseT=CFG.BATCH_PAUSE;}
      else if(wave<CFG.WAVES){phase="wavepause";phaseT=CFG.WAVE_PAUSE;SFX.wave();}
      else{phase="bosswarn";phaseT=2.2;SFX.warn();}
    }
  }
  else if(phase==="batchpause"){phaseT-=dt;if(phaseT<=0){batch++;spawnSquad();phase="combat";}}
  else if(phase==="wavepause"){phaseT-=dt;if(phaseT<=0){wave=2;batch=1;spawnSquad();phase="combat";}}
  else if(phase==="bosswarn"){phaseT-=dt;if(phaseT<=0){spawnBoss();phase="boss";}}
  else if(phase==="bossdead"){phaseT-=dt;if(phaseT<=0){if(level>=CFG.LEVELS)endGame(true);else levelUp();}}
  bars();
}

/* ================= GAMBAR ================= */
function text(t,x,y,size,col,blur){
  ctx.save();ctx.font="bold "+size+"px 'Courier New',monospace";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.shadowColor=col;ctx.shadowBlur=blur||14;ctx.fillStyle=col;
  ctx.fillText(t,x,y);ctx.restore();
}
function hpBarMini(x,y,w,r){
  ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(x,y,w,4);
  ctx.fillStyle="hsl("+Math.max(0,r*120)+",100%,55%)";ctx.fillRect(x,y,w*Math.max(0,r),4);
}
function drawPlayer(){
  if(player.inv>0&&Math.floor(time*12)%2===0)return;
  ctx.save();ctx.translate(player.x,player.y);ctx.scale(player.scale,player.scale);
  if(player.reload>0){ // indikator reload di atas pesawat
    ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(-15,-26,30,4);
    ctx.fillStyle="#ffd24a";ctx.fillRect(-15,-26,30*(1-player.reload/CFG.RELOAD_TIME),4);
  }
  ctx.fillStyle="rgba(255,180,0,.85)";
  ctx.beginPath();ctx.moveTo(-4,12);ctx.lineTo(4,12);ctx.lineTo(0,17+Math.sin(time*30)*3);ctx.closePath();ctx.fill();
  ctx.shadowColor="#0ff";ctx.shadowBlur=14;ctx.fillStyle="#7dffea";
  ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(11,10);ctx.lineTo(0,4);ctx.lineTo(-11,10);ctx.closePath();ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.85)";ctx.fillRect(-1.5,-6,3,6);
  ctx.restore();
}
function drawEnemy(e){
  const s=Math.max(.05,1-e.spawn/.4);
  ctx.save();ctx.translate(e.x,e.y);ctx.scale(s,s);ctx.globalAlpha=s;
  ctx.shadowColor="#ff3d6e";ctx.shadowBlur=12;
  ctx.fillStyle=e.flash>0?"#fff":"#ff3d6e";
  ctx.beginPath();ctx.moveTo(0,13);ctx.lineTo(11,-10);ctx.lineTo(0,-4);ctx.lineTo(-11,-10);ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;
  hpBarMini(-11,-2,22,e.hp/e.maxHp); // bar HP di tengah badan
  ctx.restore();
}
function drawBoss(){
  const B=boss;if(!B)return;const col=BOSSES[level].col;
  ctx.save();ctx.translate(B.x,B.y);
  if(B.state==="dashtele"&&Math.floor(time*12)%2===0){ctx.strokeStyle="#fff";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,34,0,7);ctx.stroke();}
  ctx.shadowColor=col;ctx.shadowBlur=18;
  ctx.fillStyle=B.flash>0?"#fff":col;
  ctx.beginPath();ctx.moveTo(0,26);ctx.lineTo(26,-20);ctx.lineTo(10,-10);ctx.lineTo(0,-20);
  ctx.lineTo(-10,-10);ctx.lineTo(-26,-20);ctx.closePath();ctx.fill();
  hpBarMini(-20,-2,40,B.hp/B.maxHp);
  ctx.restore();
  // bar HP boss di atas layar
  text(BOSSES[level].name,W/2,14,11,col,8);
  ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(40,22,W-80,6);
  ctx.fillStyle=col;ctx.fillRect(40,22,(W-80)*Math.max(0,B.hp/B.maxHp),6);
}
function drawPB(b){ctx.save();ctx.shadowColor="#0ff";ctx.shadowBlur=8;ctx.fillStyle="#aeffff";ctx.fillRect(b.x-2,b.y-8,4,12);ctx.restore();}
function drawEB(b){
  ctx.save();ctx.shadowColor=b.col;ctx.shadowBlur=10;ctx.fillStyle=b.col;
  ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill();
  if(b.bouncy){ctx.strokeStyle="rgba(255,210,74,.6)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(b.x,b.y,6.5,0,7);ctx.stroke();}
  ctx.restore();
}
function drawLasers(){
  const blink=Math.floor(time*10)%2===0;
  for(const L of lasers){
    const active=L.t>=L.tele;
    if(L.kind==="sweep"){
      if(!active){if(blink){ctx.fillStyle="rgba(255,210,74,.5)";ctx.fillRect(L.dir===1?0:W-4,0,4,H);}}
      else{const x=sweepX(L);
        const g=ctx.createLinearGradient(x-L.w/2,0,x+L.w/2,0);
        g.addColorStop(0,"rgba(255,61,110,0)");g.addColorStop(.5,"rgba(255,61,110,.55)");g.addColorStop(1,"rgba(255,61,110,0)");
        ctx.fillStyle=g;ctx.fillRect(x-L.w/2,0,L.w,H);
        ctx.fillStyle="rgba(255,255,255,.8)";ctx.fillRect(x-2,0,4,H);}
    }else{
      const a=active?.55:(blink?.3:0);
      if(a>0){
        ctx.fillStyle=active?"rgba(255,61,110,"+a+")":"rgba(255,210,74,"+a+")";
        ctx.fillRect(L.px-13,0,26,H);ctx.fillRect(0,L.py-13,W,26);
        if(active){ctx.fillStyle="rgba(255,255,255,.8)";ctx.fillRect(L.px-2,0,4,H);ctx.fillRect(0,L.py-2,W,4);}
      }
    }
  }
}
function drawBeam(){
  if(ultT<=0)return;
  const bw=W*.9,bx=clamp(player.x-bw/2,0,W-bw);
  const g=ctx.createLinearGradient(0,0,0,player.y);
  g.addColorStop(0,"rgba(0,255,255,.06)");g.addColorStop(1,"rgba(0,255,255,.45)");
  ctx.fillStyle=g;ctx.fillRect(bx,0,bw,player.y-10);
  ctx.fillStyle="rgba(255,255,255,.5)";
  for(let y=(time*500)%44;y<player.y-10;y+=44)ctx.fillRect(bx,y,bw,3);
  ctx.strokeStyle="#0ff";ctx.lineWidth=2;ctx.strokeRect(bx+1,0,bw-2,player.y-10);
}
function drawPhaseText(){
  if(phase==="banner"){
    text("LEVEL "+level,W/2,H*.4,34,"#7dffea");
    text("WAVE "+wave,W/2,H*.4+34,16,"#9adcff");
    text("GET READY",W/2,H*.4+64,12,"#ffd24a");
  }else if(phase==="wavepause"){
    if(Math.floor(time*2)%2===0)text("SECOND WAVE",W/2,H*.42,30,"#ffd24a");
    text("in "+Math.ceil(phaseT)+"...",W/2,H*.42+32,13,"#9adcff");
  }else if(phase==="batchpause")text("NEXT SQUAD INCOMING...",W/2,H*.42,13,"#8fb7d9");
  else if(phase==="bosswarn"){
    if(Math.floor(time*4)%2===0)text("WARNING!!",W/2,H*.42,36,"#ff3d6e");
    text("BOSS APPROACHING",W/2,H*.42+34,14,"#ffd24a");
  }else if(phase==="bossdead")text("BOSS DEFEATED!",W/2,H*.42,26,"#3dff7a");
  if(ult>=100&&ultT<=0&&player.alive&&Math.floor(time*3)%2===0)
    text("ULTIMATE READY - PRESS [U]",W/2,H-14,12,"#0ff");
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake)*.5,rnd(-shake,shake)*.5);
  ctx.fillStyle="rgba(200,240,255,.7)";
  for(const s of stars){ctx.globalAlpha=s.s/2;ctx.fillRect(s.x,s.y,s.s,s.s);}
  ctx.globalAlpha=1;
  if(state!=="attract"){
    drawBeam();drawLasers();
    for(const b of pB)drawPB(b);
    for(const e of enemies)drawEnemy(e);
    if(boss&&!boss.dead)drawBoss();
    for(const b of eB)drawEB(b);
    if(player.alive)drawPlayer();
    for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}
    ctx.globalAlpha=1;
  }
  ctx.restore();
  if(hitFlash>0){ctx.fillStyle="rgba(255,0,60,"+Math.min(.45,hitFlash)+")";ctx.fillRect(0,0,W,H);}
  if(state==="playing")drawPhaseText();
}

/* ================= LOOP ================= */
let last=0;
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(!paused)update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
bars();
</script>
